<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xBlueHook | Temporarily Unavailable</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0f1011;
  --card: #1e1f22;
  --accent: #5865f2;
  --accent2: #23a559;
  --text: #f2f3f5;
  --muted: #949ba4;
}

* {margin:0;padding:0;box-sizing:border-box;}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: radial-gradient(circle at top, #1a1b1f, #0f1011);
  color: var(--text);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* glow background */
.bg-glow {
  position:absolute;
  width:500px;
  height:500px;
  background: var(--accent);
  filter: blur(150px);
  opacity:0.15;
  top:-100px;
  right:-100px;
}

/* card */
.container {
  position:relative;
  text-align:center;
  background: var(--card);
  padding:50px 40px;
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  width:90%;
  max-width:520px;
  animation:fadeIn 1s ease;
}

.logo {
  font-size:1.8rem;
  font-weight:800;
  color: var(--accent);
  margin-bottom:10px;
}

.status-badge {
  display:inline-block;
  padding:6px 14px;
  border-radius:50px;
  background: rgba(255, 70, 85, 0.1);
  color:#ff4655;
  font-size:13px;
  font-weight:600;
  margin-bottom:20px;
}

h1 {
  font-size:1.8rem;
  margin-bottom:10px;
}

p {
  color:var(--muted);
  margin-bottom:25px;
  line-height:1.6;
}

.loader {
  width:45px;
  height:45px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,0.08);
  border-top:4px solid var(--accent);
  margin:25px auto;
  animation:spin 1s linear infinite;
}

.actions {
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn {
  padding:10px 18px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:600;
  transition:0.2s;
  text-decoration:none;
}

.btn-primary {
  background: var(--accent);
  color:white;
}

.btn-primary:hover {
  transform: translateY(-2px);
  background:#4752c4;
}

.btn-secondary {
  background:#2b2d31;
  color:white;
}

.btn-secondary:hover {
  background:#3a3c42;
}

/* animations */
@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="container">
  <div class="logo">xBlueHook</div>

  <div class="status-badge">● Service Temporarily Disabled</div>

  <h1>We're upgrading the system 🚧</h1>

  <p>
    The website is currently under maintenance to improve performance and add new features.<br>
    Please check back later.
  </p>

  <div class="loader"></div>

  <div class="actions">
    <a href="mailto:xbluestudio2009@gmail.com" class="btn btn-primary">Contact Support</a>
    <a href="#" class="btn btn-secondary">Discord Server</a>
  </div>
</div>

</body>
</html>
