<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xBlue Marketplace</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Plus Jakarta Sans', sans-serif;
  background:#0f1011;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.container {
  background:#1e1f22;
  padding:40px;
  border-radius:15px;
  width:350px;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
}

h2 {
  text-align:center;
  margin-bottom:20px;
}

input {
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  border:none;
  background:#2b2d31;
  color:white;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#5865f2;
  color:white;
  font-weight:600;
  cursor:pointer;
}

button:hover {
  background:#4752c4;
}

.switch {
  text-align:center;
  margin-top:10px;
  cursor:pointer;
  color:#949ba4;
}

#msg {
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
  <h2 id="title">Login</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="handleAuth()">Continue</button>

  <div class="switch" onclick="toggleMode()">Create account</div>

  <div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUbpzyuACWNlDIkfe_A47sSQd_We41Gbk",
  authDomain: "my-marketplace-c2cd7.firebaseapp.com",
  databaseURL: "https://my-marketplace-c2cd7-default-rtdb.firebaseio.com",
  projectId: "my-marketplace-c2cd7",
  storageBucket: "my-marketplace-c2cd7.firebasestorage.app",
  messagingSenderId: "649905836994",
  appId: "1:649905836994:web:3e3d83a093c5216838fc5b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let isLogin = true;

window.toggleMode = () => {
  isLogin = !isLogin;
  document.getElementById("title").innerText = isLogin ? "Login" : "Register";
};

window.handleAuth = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  try {
    if (isLogin) {
      // 🔐 تسجيل دخول
      await signInWithEmailAndPassword(auth, email, password);
      msg.innerText = "Logged in ✅";

      // 🚀 تحويل للداشبورد
      window.location.href = "dashboard.html";

    } else {
      // 🆕 إنشاء حساب
      const userCred = await createUserWithEmailAndPassword(auth, email, password);

      await set(ref(db, 'users/' + userCred.user.uid), {
        email: email,
        role: "buyer",
        createdAt: Date.now()
      });

      msg.innerText = "Account created ✅";

      // 🚀 تحويل للداشبورد
      window.location.href = "dashboard.html";
    }

  } catch (e) {
    msg.innerText = e.message;
  }
};
</script>
</body>
</html>
