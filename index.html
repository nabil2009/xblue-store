<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Marketplace</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    .error {
      color: red;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">

<h2>Register</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<select id="role">
  <option value="buyer">Buyer</option>
  <option value="seller">Seller</option>
</select>

<button onclick="register()">Create Account</button>

<hr>

<h2>Login</h2>
<input id="loginEmail" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="error" class="error"></p>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUbpzyuACWNlDIkfe_A47sSQd_We41Gbk",
  authDomain: "my-marketplace-c2cd7.firebaseapp.com",
  databaseURL: "https://my-marketplace-c2cd7-default-rtdb.firebaseio.com",
  projectId: "my-marketplace-c2cd7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

function showError(msg) {
  document.getElementById("error").innerText = msg;
}

// تسجيل حساب
window.register = async function() {
  try {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    if (!email || !password) return showError("Fill all fields");

    const user = await createUserWithEmailAndPassword(auth, email, password);

    await set(ref(db, "users/" + user.user.uid), {
      email: email,
      role: role
    });

    alert("Registered!");
  } catch (e) {
    showError(e.message);
  }
}

// تسجيل دخول (معدل وصحيح)
window.login = async function() {
  try {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) return showError("Fill all fields");

    await signInWithEmailAndPassword(auth, email, password);

    // حفظ حالة الدخول
    localStorage.setItem("loggedIn", "true");

    // تحويل للداشبورد
    window.location.href = "dashboard.html";

  } catch (e) {
    showError(e.message);
  }
}
</script>

</body>
</html>
