<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | xBlue Marketplace</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Plus Jakarta Sans', sans-serif;
  background:#0f1011;
  color:white;
}

nav {
  background:#1e1f22;
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
}

.container {
  padding:25px;
  max-width:900px;
  margin:auto;
}

.card {
  background:#1e1f22;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

input, textarea {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  background:#2b2d31;
  color:white;
}

button {
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#5865f2;
  color:white;
  cursor:pointer;
}

.order {
  background:#2b2d31;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<nav>
  <div>Dashboard</div>
  <button onclick="logout()">Logout</button>
</nav>

<div class="container">

  <div class="card">
    <h3>Create Order</h3>
    <input id="title" placeholder="Title">
    <textarea id="desc" placeholder="Description"></textarea>
    <input id="budget" placeholder="Budget">
    <button onclick="createOrder()">Submit</button>
  </div>

  <div class="card">
    <h3>Orders</h3>
    <div id="orders"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getDatabase,
  ref,
  push,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUbpzyuACWNlDIkfe_A47sSQd_We41Gbk",
  authDomain: "my-marketplace-c2cd7.firebaseapp.com",
  databaseURL: "https://my-marketplace-c2cd7-default-rtdb.firebaseio.com",
  projectId: "my-marketplace-c2cd7",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser;

// 🔐 تأكد المستخدم مسجل
onAuthStateChanged(auth, user => {
  if (!user) {
    location.href = "index.html";
  } else {
    currentUser = user;
    loadOrders();
  }
});

// ➕ إنشاء طلب
window.createOrder = () => {
  const title = document.getElementById("title").value;
  const desc = document.getElementById("desc").value;
  const budget = document.getElementById("budget").value;

  push(ref(db, "orders"), {
    title,
    desc,
    budget,
    status: "open",
    userId: currentUser.uid,
    createdAt: Date.now()
  });

  alert("Order created ✅");
};

// 📦 عرض الطلبات
function loadOrders() {
  const ordersRef = ref(db, "orders");

  onValue(ordersRef, snapshot => {
    const data = snapshot.val();
    const container = document.getElementById("orders");
    container.innerHTML = "";

    if (!data) return;

    Object.values(data).reverse().forEach(order => {
      container.innerHTML += `
        <div class="order">
          <b>${order.title}</b><br>
          ${order.desc}<br>
          💰 ${order.budget}<br>
          📌 ${order.status}
        </div>
      `;
    });
  });
}

// 🚪 تسجيل خروج
window.logout = () => {
  signOut(auth);
};
</script>

</body>
</html>
