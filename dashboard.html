<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>xBlue Marketplace</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0c0f;
  --panel:#111218;
  --card:#171922;
  --border:#222532;
  --accent:#5865f2;
  --text:#eef1f6;
  --muted:#8b93a7;
  --success:#23a559;
  --danger:#ff4655;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* Sidebar */
.sidebar{
  width:250px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:20px;
}
.logo{
  font-weight:700;
  font-size:18px;
  color:var(--accent);
}
.nav button{
  width:100%;
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  padding:10px;
  border-radius:8px;
  text-align:left;
  cursor:pointer;
}
.nav button:hover{
  border-color:var(--accent);
  color:white;
}

/* Main */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* Topbar */
.topbar{
  height:60px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:var(--panel);
}
.user{
  color:var(--muted);
}

/* Content */
.content{
  padding:25px;
  overflow:auto;
}

/* Cards */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

/* Inputs */
input, textarea{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:#0f1117;
  border:1px solid var(--border);
  border-radius:8px;
  color:white;
}
input:focus, textarea:focus{
  outline:none;
  border-color:var(--accent);
}

/* Buttons */
.btn{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:500;
}
.btn-primary{background:var(--accent); color:white;}
.btn-ghost{background:transparent; border:1px solid var(--border); color:var(--muted);}
.btn-ghost:hover{border-color:var(--accent); color:white;}

/* Orders */
.order{
  border:1px solid var(--border);
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}
.order-top{
  display:flex;
  justify-content:space-between;
}
.status{
  font-size:12px;
  padding:3px 8px;
  border-radius:6px;
}
.open{background:#2b2d31;}
.accepted{background:var(--success);}
.completed{background:var(--accent);}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="logo">xBlue</div>

  <div class="nav">
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('profile')">Profile</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<!-- Main -->
<div class="main">

  <div class="topbar">
    <div>Marketplace Dashboard</div>
    <div class="user" id="userEmail"></div>
  </div>

  <div class="content">

    <!-- Dashboard -->
    <div id="dashboardPage">

      <div class="grid">

        <div class="card">
          <h3>Create Order</h3>
          <input id="title" placeholder="Project title">
          <textarea id="desc" placeholder="Describe your project..."></textarea>
          <input id="budget" placeholder="Budget">
          <button class="btn btn-primary" onclick="createOrder()">Create</button>
        </div>

        <div class="card">
          <h3>Quick Stats</h3>
          <p id="stats">Loading...</p>
        </div>

      </div>

      <div class="card">
        <h3>Orders</h3>
        <div id="orders"></div>
      </div>

    </div>

    <!-- Profile -->
    <div id="profilePage" style="display:none">
      <div class="card">
        <h3>Profile</h3>
        <input id="name" placeholder="Name">
        <textarea id="bio" placeholder="About you"></textarea>
        <input id="skills" placeholder="Skills">
        <button class="btn btn-primary" onclick="saveProfile()">Save</button>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUbpzyuACWNlDIkfe_A47sSQd_We41Gbk",
  authDomain: "my-marketplace-c2cd7.firebaseapp.com",
  databaseURL: "https://my-marketplace-c2cd7-default-rtdb.firebaseio.com",
  projectId: "my-marketplace-c2cd7",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser;

onAuthStateChanged(auth, user=>{
  if(!user) return location.href="index.html";
  currentUser = user;
  userEmail.innerText = user.email;
  loadOrders();
  loadProfile();
});

// Navigation
window.showPage = (p)=>{
  dashboardPage.style.display = p==='dashboard'?'block':'none';
  profilePage.style.display = p==='profile'?'block':'none';
};

// Orders
window.createOrder = ()=>{
  push(ref(db,"orders"),{
    title:title.value,
    desc:desc.value,
    budget:budget.value,
    status:"open",
    userId:currentUser.uid
  });
};

function loadOrders(){
  onValue(ref(db,"orders"),snap=>{
    const data=snap.val();
    orders.innerHTML="";
    let count=0;

    if(!data) return;

    Object.values(data).reverse().forEach(o=>{
      count++;
      orders.innerHTML+=`
        <div class="order">
          <div class="order-top">
            <b>${o.title}</b>
            <span class="status ${o.status}">${o.status}</span>
          </div>
          <div>${o.desc}</div>
          <div>💰 ${o.budget}</div>
        </div>
      `;
    });

    stats.innerText = count + " orders";
  });
}

// Profile
window.saveProfile=()=>{
  set(ref(db,"profiles/"+currentUser.uid),{
    name:name.value,
    bio:bio.value,
    skills:skills.value
  });
};

async function loadProfile(){
  const snap = await get(ref(db,"profiles/"+currentUser.uid));
  if(snap.exists()){
    const d=snap.val();
    name.value=d.name||"";
    bio.value=d.bio||"";
    skills.value=d.skills||"";
  }
}

// Logout
window.logout=()=>signOut(auth);
</script>

</body>
</html>
